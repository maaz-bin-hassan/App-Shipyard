name: Release

# Disabled. This job does not run. The publish step is a dry run of the
# tarball from npm run pack:npm. To publish for real: set `if` to true,
# remove `--dry-run`, and provide NPM_TOKEN. Do not run this until you
# mean to put createshipyard on the registry.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    name: publish createshipyard
    if: false
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Pack
        run: pnpm pack:npm

      - name: Dry run only
        run: npm publish release/createshipyard-1.0.0.tgz --dry-run --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
